<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/berd-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        const readThemeMode = () => {
          const storedThemeMode = localStorage.getItem("goose-theme-mode");
          if (
            storedThemeMode === "system" ||
            storedThemeMode === "light" ||
            storedThemeMode === "dark"
          ) {
            return storedThemeMode;
          }

          return "system";
        };

        try {
          const root = document.documentElement;
          const storedTheme = readThemeMode();
          const resolvedTheme =
            storedTheme === "system"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : storedTheme;
          root.classList.add(resolvedTheme === "dark" ? "dark" : "light");
          root.style.colorScheme = resolvedTheme === "dark" ? "dark" : "light";
          // Accent roles are applied by ThemeProvider before the first React paint.

          const isDark = resolvedTheme === "dark";
          // Pre-stylesheet paint: keep in sync with --canvas-base and
          // --dot-color-base in src/shared/styles/globals.css.
          const canvasBase = isDark ? "#1a1a1a" : "#f5f5f5";
          const dotColor = isDark ? "rgba(255, 255, 255, 0.12)" : "#cbcbcb";
          root.style.setProperty("--startup-canvas-base", canvasBase);
          root.style.setProperty("--startup-dot-color", dotColor);
          root.style.setProperty("--startup-dot-size", "1px");
          root.style.setProperty("--startup-dot-spacing", "24px");

          const startupStyle = document.createElement("style");
          startupStyle.textContent = `
html,
body,
#root {
  height: 100%;
  overflow: hidden;
}

body {
  margin: 0;
}

body,
#root {
  background-color: var(--canvas-base, var(--startup-canvas-base));
  background-image: radial-gradient(
    circle,
    var(--dot-color-base, var(--startup-dot-color)) var(--dot-size, var(--startup-dot-size)),
    transparent var(--dot-size, var(--startup-dot-size))
  );
  background-size: var(--dot-spacing, var(--startup-dot-spacing)) var(--dot-spacing, var(--startup-dot-spacing));
  background-position: 0 0;
}`;
          document.head.appendChild(startupStyle);
        } catch {
          // ThemeProvider applies the canonical theme state after React mounts.
        }
      })();
    </script>
    <title>Berd</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
